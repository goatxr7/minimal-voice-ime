# Rime schema
# encoding: utf-8

schema:
  schema_id: luna_pinyin_simp
  name: 明月拼音·简
  version: '0.1'
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    基于朙月拼音的简体中文输入方案，用于极简语音输入法。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction

translator:
  dictionary: luna_pinyin_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  enable_sentence: true
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: true
  initial_quality: 1

punctuator:
  half_shape:
    ':' : ':'
    ',' : ','
    '.' : '.'
    '?' : '?'
    '!' : '!'
    ';' : ';'
    '"' : { pair: [ "“", "”" ] }
    "'" : { pair: [ "‘", "’" ] }
  full_shape:
    ':' : '：'
    ',' : '，'
    '.' : '。'
    '?' : '？'
    '!' : '！'
    ';' : '；'
    '"' : { pair: [ "“", "”" ] }
    "'" : { pair: [ "‘", "’" ] }
